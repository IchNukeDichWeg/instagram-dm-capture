<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #666; --border: #ddd; --accent: #0064e0; --rec: #e0245e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1c1e; --fg: #eee; --muted: #999; --border: #3a3a3c; --accent: #4c9aff; --rec: #ff5c8a; }
    }
    body { margin: 0; padding: 14px; width: 270px; font: 13px -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
    .dot.on { background: var(--rec); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .stats { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; padding: 2px 0; }
    .row span:first-child { color: var(--muted); }
    .val { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
    .big { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
    button { width: 100%; padding: 8px; margin-top: 6px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button:disabled { opacity: .4; cursor: default; }
    .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; line-height: 1.4; }
    .err { color: var(--rec); }
    .opt { display: flex; gap: 6px; align-items: flex-start; margin: 0 0 6px; line-height: 1.35; cursor: pointer; }
    .opt input { margin: 2px 0 0; }
    progress { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <h1><span id="dot" class="dot"></span><span id="state">Idle</span></h1>
  <div class="stats">
    <div class="big" id="count">0</div>
    <div class="row"><span>messages captured</span><span id="threads"></span></div>
    <div class="row"><span>open chat</span><span id="chat" class="val">-</span></div>
    <div class="row"><span>oldest</span><span id="oldest">-</span></div>
    <div class="row"><span>newest</span><span id="newest">-</span></div>
    <div class="row"><span>responses</span><span id="responses">0</span></div>
    <div class="row"><span>skipped</span><span id="skipped">0</span></div>
  </div>
  <label class="opt"><input type="checkbox" id="media"> Save photos, videos &amp; profile pictures locally</label>
  <button id="start" class="primary">Start capture</button>
  <button id="finish" class="primary" hidden>Finish &amp; save JSON</button>
  <button id="again" hidden>Save JSON again</button>
  <button id="clear">Clear</button>
  <progress id="bar" hidden></progress>
  <p class="hint" id="hint"></p>
  <script src="popup.js"></script>
</body>
</html>
